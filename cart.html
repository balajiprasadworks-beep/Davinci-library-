<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart — DaVinci's Medical Library</title>
<meta name="description" content="Review your notes and pay by QR.">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DaVinci's Medical Library">
<meta property="og:title" content="Your Cart — DaVinci's Medical Library">
<meta property="og:description" content="Review your notes and pay by QR.">
<meta property="og:image" content="assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your Cart — DaVinci's Medical Library">
<meta name="twitter:description" content="Review your notes and pay by QR.">
<meta name="twitter:image" content="assets/img/og.png">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c9a55c' stroke-width='2'/><path d='m20 11-3 7-7 3 3-7z' fill='%23e3c88a'/></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main class="wrap section" id="main">
  <div class="section-head">
    <p class="eyebrow">Checkout</p>
    <h1>Your Cart</h1>
  </div>

  <div id="cart-root"></div>
</main>

<div id="footer-slot"></div>

<script type="module">
  import { SITE, PAYMENT, money } from "./js/config.js";
  import { CATEGORIES, subLabel } from "./js/catalog.js";
  import * as cart from "./js/cart.js";
  import { mountShell, toast, icons } from "./js/shell.js";

  mountShell("cart");

  const root = document.getElementById("cart-root");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function emptyHTML() {
    return `
    <div class="glass empty-state">
      ${icons.bag}
      <h3>Your cart is empty</h3>
      <p>Pick the notes you need and they'll appear here.</p>
      <a class="btn btn-primary u-mt-sm" href="index.html">Browse the library</a>
    </div>`;
  }

  function qrPanelHTML(total) {
    return `
    <div class="glass qr-panel">
      <p class="eyebrow">Step 1 · Pay ${money(total)}</p>
      <div class="qr-frame">
        <img src="${PAYMENT.qrImage}" alt="Payment QR code"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'qr-missing',textContent:'Payment QR not added yet — save your QR image to assets/img/payment-qr.png'}))">
      </div>
      <p class="qr-note u-mt-sm">${esc(PAYMENT.deliveryNote)}</p>
    </div>

    <!-- novalidate: the browser's native bubbles would block submit before
           our own handler runs, leaving the styled inline errors unreachable.
           type/required stay for semantics and mobile keyboards. -->
      <form class="glass qr-panel form-left" id="confirm-form" novalidate>
      <p class="eyebrow">Step 2 · Confirm your payment</p>
      <div class="field" id="field-email">
        <label for="email">Email for delivery</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               placeholder="you@example.com" aria-describedby="err-email">
        <p class="field-error" id="err-email">Enter the email address your notes should go to.</p>
      </div>
      <div class="field" id="field-txn">
        <label for="txn">UPI transaction / reference ID</label>
        <input type="text" id="txn" name="txn" required
               placeholder="e.g. 4483xxxxxxxx" aria-describedby="err-txn">
        <p class="field-error" id="err-txn">Enter the reference your UPI app showed after payment.</p>
      </div>
      <button type="submit" class="btn btn-primary btn-block">I've paid — place my order</button>
    </form>`;
  }

  /**
   * The gateway path: one field, one button. Cashfree's own hosted
   * checkout collects however the buyer chooses to pay (UPI, card,
   * netbanking) — nothing here needs to ask for a reference, because
   * Cashfree tells the server directly whether it was actually paid.
   */
  function cashfreePanelHTML(total) {
    return `
    <!-- novalidate: see the note on the QR form above — same reason. -->
    <form class="glass qr-panel form-left" id="cashfree-form" novalidate>
      <p class="eyebrow">Pay ${money(total)}</p>
      <div class="field" id="field-cf-email">
        <label for="cf-email">Email for delivery</label>
        <input type="email" id="cf-email" name="email" required autocomplete="email"
               placeholder="you@example.com" aria-describedby="err-cf-email">
        <p class="field-error" id="err-cf-email">Enter the email address your notes should go to.</p>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Pay ${money(total)} with Cashfree</button>
      <p class="qr-note u-mt-sm">UPI, cards and netbanking. You'll come straight back here once it's done.</p>
    </form>`;
  }

  function confirmedHTML(order, variant) {
    const lines = order.items.map((i) => `${i.title} — ${money(i.price)}`).join("\n");
    const body = encodeURIComponent(
      `Order ${order.ref}\n\n${lines}\n\nTotal: ${money(order.total)}\nTransaction ID: ${order.txnId}\nDeliver to: ${order.email}`
    );
    const subject = encodeURIComponent(`Order ${order.ref} — DaVinci's Medical Library`);
    const wa = SITE.whatsapp
      ? `<a class="btn btn-ghost" href="https://wa.me/${SITE.whatsapp}?text=${body}" target="_blank" rel="noopener">Send on WhatsApp</a>`
      : "";

    const toEmail = order.email ? ` to <strong>${esc(order.email)}</strong>` : "";
    const notes = {
      gateway: `
        <p class="order-note">
          Payment received — your notes are on their way${toEmail} right now.
        </p>
        <div class="order-actions">
          <a class="btn btn-primary" href="dashboard.html">View my orders</a>
          <a class="btn btn-ghost" href="index.html">Keep browsing</a>
        </div>`,
      "gateway-pending": `
        <p class="order-note">
          Still confirming with the payment gateway — this can take a
          minute. You don't need to do anything; your notes reach${toEmail}
          the moment it clears, and the order book will show it too.
        </p>
        <div class="order-actions">
          <a class="btn btn-primary" href="dashboard.html">View my orders</a>
          <a class="btn btn-ghost" href="index.html">Keep browsing</a>
        </div>`,
      server: `
        <p class="order-note">
          We have your order and your payment reference — nothing else is needed
          from you. Your notes reach <strong>${esc(order.email)}</strong> within
          12 hours, once the payment is checked.
        </p>
        <div class="order-actions">
          <a class="btn btn-primary" href="dashboard.html">View my orders</a>
          <a class="btn btn-ghost" href="index.html">Keep browsing</a>
        </div>`,
      local: `
        <p class="order-note">
          Your order is saved on this device. <strong>Send us the reference</strong>
          so your notes can be released — they'll reach
          <strong>${esc(order.email)}</strong> within 12 hours.
        </p>
        <div class="order-actions">
          <a class="btn btn-primary" href="mailto:${SITE.contactEmail}?subject=${subject}&body=${body}">Email the reference</a>
          ${wa}
          <a class="btn btn-ghost" href="dashboard.html">View my orders</a>
        </div>`,
    };

    return `
    <div class="glass empty-state order-confirm">
      ${icons.check}
      <h2>Order placed</h2>
      <p class="order-ref">
        ${esc(order.ref)}
      </p>
      ${notes[variant]}
    </div>`;
  }

  function confirmingHTML(ref) {
    return `
    <div class="glass empty-state order-confirm">
      ${icons.check}
      <h2>Confirming your payment…</h2>
      <p class="order-ref">${esc(ref)}</p>
      <p class="order-note">This only takes a moment.</p>
    </div>`;
  }

  /**
   * Send the order to the API, which prices it from the catalogue and
   * records it so the seller actually learns about the sale.
   *
   * Falls back to the original browser-only flow whenever the API is
   * absent, unconfigured or unreachable — on that path the buyer has to
   * email the reference, which is exactly how the site worked before the
   * backend existed. A missing environment variable must not cost a sale.
   */
  async function submitOrder({ email, txnId }) {
    const ids = cart.items().map((p) => p.id);
    try {
      const res = await fetch("/api/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids, email, txnId }),
      });

      if (res.ok) {
        const server = await res.json();
        // Keep a local copy so the dashboard still works offline.
        return {
          order: cart.saveOrder({ ...server, txnId, status: "awaiting-payment-check", recordedOnServer: true }),
          variant: "server",
        };
      }

      // The server rejected the input — show its reason on the field.
      if (res.status === 400) {
        const { error, field } = await res.json();
        return { error: { message: error, field } };
      }
      // 404/501/502 all mean "no working backend": fall through.
    } catch {
      // Offline, or the API route does not exist on this host.
    }

    return { order: cart.placeOrder({ email, txnId }), variant: "local" };
  }

  /**
   * Detected once per page load, never assumed: whether /api/health
   * says Cashfree is actually wired up server-side. Any failure here
   * (offline, no backend, health route missing) means false, which
   * means the QR/manual flow below — a missing environment variable
   * must not cost anyone a checkout.
   */
  async function cashfreeIsAvailable() {
    try {
      const res = await fetch("/api/health");
      if (!res.ok) return false;
      const h = await res.json();
      return Boolean(h?.cashfree?.configured);
    } catch {
      return false;
    }
  }

  let cashfreeSdkPromise = null;
  function loadCashfreeSdk() {
    if (cashfreeSdkPromise) return cashfreeSdkPromise;
    // Loaded only here, only when a buyer is actually about to pay through
    // Cashfree — the one deliberate exception to "nothing on this site is
    // fetched from anyone else" (see README). A payment processor's live
    // checkout cannot be self-hosted; every other page stays untouched.
    cashfreeSdkPromise = new Promise((resolve, reject) => {
      if (window.Cashfree) return resolve(window.Cashfree);
      const script = document.createElement("script");
      script.src = "https://sdk.cashfree.com/js/v3/cashfree.js";
      script.onload = () => window.Cashfree ? resolve(window.Cashfree) : reject(new Error("Cashfree.js did not load"));
      script.onerror = () => reject(new Error("Could not load the payment gateway"));
      document.head.appendChild(script);
    });
    return cashfreeSdkPromise;
  }

  async function submitCashfreeOrder({ email }) {
    const ids = cart.items().map((p) => p.id);
    const res = await fetch("/api/cashfree-create-order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids, email }),
    });

    if (!res.ok) {
      if (res.status === 400) {
        const { error, field } = await res.json();
        return { error: { message: error, field } };
      }
      const { error } = await res.json().catch(() => ({}));
      return { error: { message: error ?? "The payment gateway is unavailable right now." } };
    }

    const server = await res.json();
    // Saved before redirecting: if the buyer never makes it back (closes
    // the tab mid-payment), the order still shows up on their dashboard.
    cart.saveOrder({ ...server, status: "awaiting-payment", provider: "cashfree" });

    const CashfreeFactory = await loadCashfreeSdk();
    const cashfree = CashfreeFactory({ mode: server.mode === "production" ? "production" : "sandbox" });
    cashfree.checkout({ paymentSessionId: server.paymentSessionId, redirectTarget: "_self" });
    return { redirecting: true };
  }

  /**
   * Polls /api/order-lookup after a Cashfree redirect back to this page.
   * order-lookup itself re-checks with Cashfree directly and finalizes
   * the order if it finds one that's actually paid, so most of the time
   * this resolves on the very first poll — the webhook usually isn't
   * even the thing that gets there first.
   */
  async function pollOrderStatus(ref, { tries = 10, intervalMs = 2000 } = {}) {
    for (let i = 0; i < tries; i++) {
      try {
        const res = await fetch(`/api/order-lookup?ref=${encodeURIComponent(ref)}`);
        if (res.ok) {
          const { status } = await res.json();
          if (status && status !== "awaiting-payment") return status;
        }
      } catch {
        // A dropped request just means this round doesn't count — retry.
      }
      await new Promise((r) => setTimeout(r, intervalMs));
    }
    return null; // gave up — not a failure, just not resolved yet
  }

  /** True when this page load is a Cashfree redirect coming back, not a
   *  normal visit to the cart. Handled before anything else paints. */
  async function handleGatewayReturn() {
    const params = new URLSearchParams(location.search);
    const ref = params.get("order");
    if (!ref) return false;

    history.replaceState(null, "", location.pathname);
    root.innerHTML = confirmingHTML(ref);

    const status = await pollOrderStatus(ref);
    const local = cart.findOrder(ref);

    if (status === "delivered") {
      cart.updateOrderStatus(ref, "delivered");
      root.innerHTML = confirmedHTML(local ?? { ref, email: "", items: [], total: 0 }, "gateway");
      toast("Payment received");
    } else {
      // Not resolved within the poll window — genuinely not an error;
      // the webhook (or the buyer's next visit, which polls again via
      // order-lookup) still finalizes it. Never tell them it failed.
      root.innerHTML = confirmedHTML(local ?? { ref, email: "", items: [], total: 0 }, "gateway-pending");
    }
    return true;
  }

  async function paint() {
    const items = cart.items();
    if (!items.length) {
      root.innerHTML = emptyHTML();
      return;
    }

    const total = cart.subtotal();
    const saved = cart.savings();
    const gateway = await cashfreeIsAvailable();

    root.innerHTML = `
    <div class="cart-layout">
      <div>
        ${items.map((p) => `
          <div class="cart-line">
            <div class="cart-line-body">
              <h4>${esc(p.title)}</h4>
              <span class="sub">${esc(CATEGORIES[p.cat].title)} · ${esc(subLabel(p.cat, p.sub))}</span>
            </div>
            <span class="price">${money(p.price)}</span>
            <button class="remove-btn" data-remove="${p.id}" aria-label="Remove ${esc(p.title)}">${icons.trash}</button>
          </div>`).join("")}
      </div>

      <aside>
        <div class="glass summary">
          <div class="summary-row"><span>${items.length} ${items.length === 1 ? "title" : "titles"}</span><span>${money(total + saved)}</span></div>
          ${saved ? `<div class="summary-row"><span>Bundle saving</span><span class="saving">− ${money(saved)}</span></div>` : ""}
          <div class="summary-row"><span>Delivery</span><span>Email · free</span></div>
          <div class="summary-row total"><span>Total</span><span class="price">${money(total)}</span></div>
        </div>
        ${gateway ? cashfreePanelHTML(total) : qrPanelHTML(total)}
      </aside>
    </div>`;

    root.querySelector("#cashfree-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const email = form.email.value.trim();

      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
      document.getElementById("field-cf-email").classList.toggle("has-error", !emailOk);
      if (!emailOk) return document.getElementById("cf-email").focus();

      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      button.textContent = "Opening payment…";

      const { error } = await submitCashfreeOrder({ email }) ?? {};

      if (error) {
        button.disabled = false;
        button.textContent = `Pay ${money(total)} with Cashfree`;
        const field = document.getElementById("field-cf-email");
        if (error.field === "email" && field) {
          field.classList.add("has-error");
          field.querySelector(".field-error").textContent = error.message;
        } else {
          toast(error.message);
        }
        return;
      }
      // On success the browser is already navigating to Cashfree —
      // nothing left to render here.
    });

    root.querySelector("#confirm-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const email = form.email.value.trim();
      const txnId = form.txn.value.trim();

      // Say what is wrong and where, rather than doing nothing.
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
      const txnOk = txnId.length >= 4;
      document.getElementById("field-email").classList.toggle("has-error", !emailOk);
      document.getElementById("field-txn").classList.toggle("has-error", !txnOk);
      if (!emailOk) return document.getElementById("email").focus();
      if (!txnOk) return document.getElementById("txn").focus();

      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      button.textContent = "Recording your order…";

      const { order, variant, error } = await submitOrder({ email, txnId });

      if (error) {
        button.disabled = false;
        button.textContent = "I've paid — place my order";
        const field = document.getElementById(`field-${error.field === "txnId" ? "txn" : "email"}`);
        if (field) {
          field.classList.add("has-error");
          field.querySelector(".field-error").textContent = error.message;
        } else {
          toast(error.message);
        }
        return;
      }

      root.innerHTML = confirmedHTML(order, variant);
      toast("Order placed");
    });
  }

  root.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-remove]");
    if (!btn) return;
    cart.remove(btn.dataset.remove);
    toast("Removed from cart");
    paint();
  });

  handleGatewayReturn().then((handled) => { if (!handled) paint(); });
</script>

</body>
</html>
