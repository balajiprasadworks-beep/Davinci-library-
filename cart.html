<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart — DaVinci's Medical Library</title>
<meta name="description" content="Review your notes and pay securely with Razorpay.">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DaVinci's Medical Library">
<meta property="og:title" content="Your Cart — DaVinci's Medical Library">
<meta property="og:description" content="Review your notes and pay securely with Razorpay.">
<meta property="og:image" content="assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your Cart — DaVinci's Medical Library">
<meta name="twitter:description" content="Review your notes and pay securely with Razorpay.">
<meta name="twitter:image" content="assets/img/og.png">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c9a55c' stroke-width='2'/><path d='m20 11-3 7-7 3 3-7z' fill='%23e3c88a'/></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main class="wrap section" id="main">
  <div class="section-head">
    <p class="eyebrow">Checkout</p>
    <h1>Your Cart</h1>
  </div>

  <div id="cart-root"></div>
</main>

<div id="footer-slot"></div>

<script type="module">
  import { SITE, PAYMENT, money } from "./js/config.js";
  import { CATEGORIES, subLabel } from "./js/catalog.js";
  import * as cart from "./js/cart.js";
  import { mountShell, toast, icons } from "./js/shell.js";

  mountShell("cart");

  const root = document.getElementById("cart-root");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function emptyHTML() {
    return `
    <div class="glass empty-state">
      ${icons.bag}
      <h3>Your cart is empty</h3>
      <p>Pick the notes you need and they'll appear here.</p>
      <a class="btn btn-primary u-mt-sm" href="index.html">Browse the library</a>
    </div>`;
  }

  function payPanelHTML(total) {
    return `
    <!-- novalidate: the browser's native bubbles would block submit before
           our own handler runs, leaving the styled inline errors unreachable.
           type/required stay for semantics and mobile keyboards. -->
    <form class="glass qr-panel form-left" id="pay-form" novalidate>
      <p class="eyebrow">Pay ${money(total)}</p>
      <p class="qr-note">${esc(PAYMENT.checkoutNote)}</p>
      <div class="field" id="field-email">
        <label for="email">Email for delivery</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               placeholder="you@example.com" aria-describedby="err-email">
        <p class="field-error" id="err-email">Enter the email address your notes should go to.</p>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Pay ${money(total)} with Razorpay</button>
    </form>`;
  }

  function unavailableHTML(message) {
    return `
    <div class="glass qr-panel form-left">
      <p class="eyebrow">Checkout unavailable</p>
      <p class="qr-note">${esc(message)}</p>
      <p class="qr-note u-mt-sm">
        Try again in a moment, or email
        <a href="mailto:${SITE.contactEmail}">${esc(SITE.contactEmail)}</a> and we'll sort it out.
      </p>
    </div>`;
  }

  /**
   * Ask the server to price the cart and open a Razorpay Payment Link.
   * There is no local/offline fallback any more — a sale either goes
   * through Razorpay and gets delivered automatically, or it does not
   * happen, rather than silently falling back to a manual flow.
   */
  async function startCheckout({ email }) {
    const ids = cart.items().map((p) => p.id);
    let res;
    try {
      res = await fetch("/api/create-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids, email }),
      });
    } catch {
      return { unavailable: "Could not reach the checkout server. Check your connection and try again." };
    }

    if (res.ok) return { order: await res.json() };

    if (res.status === 400) {
      const { error, field } = await res.json();
      return { error: { message: error, field } };
    }
    if (res.status === 501) {
      return { unavailable: "Checkout is still being set up on this deployment. Please check back shortly." };
    }
    return { unavailable: "Something went wrong starting your payment. Please try again." };
  }

  function paint() {
    const items = cart.items();
    if (!items.length) {
      root.innerHTML = emptyHTML();
      return;
    }

    const total = cart.subtotal();
    const saved = cart.savings();

    root.innerHTML = `
    <div class="cart-layout">
      <div>
        ${items.map((p) => `
          <div class="cart-line">
            <div class="cart-line-body">
              <h4>${esc(p.title)}</h4>
              <span class="sub">${esc(CATEGORIES[p.cat].title)} · ${esc(subLabel(p.cat, p.sub))}</span>
            </div>
            <span class="price">${money(p.price)}</span>
            <button class="remove-btn" data-remove="${p.id}" aria-label="Remove ${esc(p.title)}">${icons.trash}</button>
          </div>`).join("")}
      </div>

      <aside>
        <div class="glass summary">
          <div class="summary-row"><span>${items.length} ${items.length === 1 ? "title" : "titles"}</span><span>${money(total + saved)}</span></div>
          ${saved ? `<div class="summary-row"><span>Bundle saving</span><span class="saving">− ${money(saved)}</span></div>` : ""}
          <div class="summary-row"><span>Delivery</span><span>Email · free</span></div>
          <div class="summary-row total"><span>Total</span><span class="price">${money(total)}</span></div>
        </div>
        ${payPanelHTML(total)}
      </aside>
    </div>`;

    root.querySelector("#pay-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const email = form.email.value.trim();

      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
      document.getElementById("field-email").classList.toggle("has-error", !emailOk);
      if (!emailOk) return document.getElementById("email").focus();

      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      button.textContent = "Starting payment…";

      const { order, unavailable, error } = await startCheckout({ email });

      if (unavailable) {
        button.disabled = false;
        button.textContent = `Pay ${money(total)} with Razorpay`;
        root.querySelector("aside").insertAdjacentHTML("beforeend", unavailableHTML(unavailable));
        toast(unavailable);
        return;
      }

      if (error) {
        button.disabled = false;
        button.textContent = `Pay ${money(total)} with Razorpay`;
        const field = document.getElementById("field-email");
        if (field && error.field === "email") {
          field.classList.add("has-error");
          field.querySelector(".field-error").textContent = error.message;
        } else {
          toast(error.message);
        }
        return;
      }

      // Keep a local copy so the buyer's own dashboard shows this order
      // even before Razorpay's webhook confirms payment. order.html
      // updates its status once delivery actually happens.
      cart.saveOrder({
        ref: order.ref,
        placedAt: new Date().toISOString(),
        email: order.email,
        status: "created",
        total: order.total,
        items: order.items,
      });

      button.textContent = "Redirecting to secure payment…";
      window.location.href = order.payUrl;
    });
  }

  root.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-remove]");
    if (!btn) return;
    cart.remove(btn.dataset.remove);
    toast("Removed from cart");
    paint();
  });

  paint();
</script>

</body>
</html>
