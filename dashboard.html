<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — DaVinci's Medical Library</title>
<meta name="description" content="Your orders, your library, your next exam.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c9a55c' stroke-width='2'/><path d='m20 11-3 7-7 3 3-7z' fill='%23e3c88a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main class="wrap section">
  <div class="section-head">
    <p class="eyebrow">Your account</p>
    <h1 id="greeting">Dashboard</h1>
    <p class="lede" id="sub-greeting">Everything you've ordered, and everything still in your cart.</p>
  </div>

  <div class="stat-grid" id="stats"></div>

  <h2 style="margin-top:20px">Orders</h2>
  <div id="orders"></div>

  <h2 style="margin-top:48px">Continue browsing</h2>
  <div class="portal-grid" id="portals"></div>
</main>

<div id="footer-slot"></div>

<script type="module">
  import { money } from "./js/config.js";
  import { CATEGORIES } from "./js/catalog.js";
  import * as cart from "./js/cart.js";
  import { mountShell, icons } from "./js/shell.js";

  mountShell("dashboard");

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const orders = cart.orders();
  const profile = cart.profile();

  if (profile.name) {
    document.getElementById("greeting").textContent = `Welcome back, ${profile.name}`;
  }
  if (profile.exam) {
    document.getElementById("sub-greeting").textContent =
      `Your orders and cart, with ${profile.exam} in view.`;
  }

  const titlesOwned = new Set(orders.flatMap((o) => o.items.map((i) => i.id))).size;
  const spent = orders.reduce((s, o) => s + o.total, 0);

  document.getElementById("stats").innerHTML = [
    ["Titles ordered", titlesOwned],
    ["Orders placed", orders.length],
    ["In your cart", cart.count()],
    ["Total value", money(spent)],
  ].map(([label, value]) => `
    <div class="stat">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}</div>
    </div>`).join("");

  const statusLabel = {
    "awaiting-confirmation": "Awaiting confirmation",
    delivered: "Delivered",
  };

  document.getElementById("orders").innerHTML = orders.length
    ? orders.map((o) => `
      <div class="cart-line" style="align-items:flex-start">
        <div class="cart-line-body">
          <h4>${esc(o.ref)}</h4>
          <span class="sub">${new Date(o.placedAt).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })}
            · ${esc(statusLabel[o.status] ?? o.status)}</span>
          <ul style="margin:12px 0 0;padding-left:18px;font-size:13px;color:var(--text-300)">
            ${o.items.map((i) => `<li>${esc(i.title)}</li>`).join("")}
          </ul>
        </div>
        <span class="price">${money(o.total)}</span>
      </div>`).join("")
    : `<div class="glass empty-state">
         ${icons.book}
         <h3>No orders yet</h3>
         <p>Your purchases will be listed here with their delivery status.</p>
         <a class="btn btn-primary" href="index.html" style="margin-top:14px">Browse the library</a>
       </div>`;

  const portalIcon = { mbbs: icons.book, internship: icons.stethoscope, abroad: icons.globe };
  document.getElementById("portals").innerHTML = Object.values(CATEGORIES).map((c) => `
    <a class="portal" href="${c.page}">
      <span class="portal-icon">${portalIcon[c.id]}</span>
      <h3>${esc(c.title)}</h3>
      <p>${esc(c.blurb)}</p>
      <span class="portal-cta">Open collection ${icons.arrow}</span>
    </a>`).join("");
</script>

</body>
</html>
