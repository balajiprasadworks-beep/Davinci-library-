<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order book — DaVinci's Medical Library</title>
<meta name="description" content="Seller order book.">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c9a55c' stroke-width='2'/><path d='m20 11-3 7-7 3 3-7z' fill='%23e3c88a'/></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main class="wrap section" id="main">
  <div class="section-head">
    <p class="eyebrow">Seller only</p>
    <h1>Order book</h1>
    <p class="lede">
      Every order, newest first. Payment and delivery both happen
      automatically — this page is for visibility, and for the rare
      refund, cancellation or resend.
    </p>
  </div>

  <div id="root"></div>
</main>

<div id="footer-slot"></div>

<script type="module">
  import { money } from "./js/config.js";
  import { mountShell, toast, icons } from "./js/shell.js";

  mountShell("");

  const root = document.getElementById("root");
  const KEY = "davinci.admin.token";
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const token = () => { try { return localStorage.getItem(KEY) ?? ""; } catch { return ""; } };
  const setToken = (t) => { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch {} };

  const api = (path, options = {}) =>
    fetch(path, {
      ...options,
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token()}`, ...options.headers },
    });

  const STATUS_LABEL = {
    created: "Awaiting payment",
    paid: "Paid — delivering",
    delivered: "Delivered",
    failed: "Payment failed",
    refunded: "Refunded",
    cancelled: "Cancelled",
  };

  function signInHTML(message = "") {
    return `
    <div class="glass u-pad u-narrow">
      <p class="eyebrow">Admin token</p>
      <p class="panel-note">
        The value of <code>ADMIN_TOKEN</code> from your Vercel environment
        variables. It is kept in this browser only.
      </p>
      ${message ? `<p class="panel-note" style="color:var(--err)">${esc(message)}</p>` : ""}
      <form id="signin">
        <div class="field">
          <label for="token">Token</label>
          <input type="password" id="token" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Open the order book</button>
      </form>
    </div>`;
  }

  const tick = (ok) => ok
    ? `<span style="color:var(--ok)">set</span>`
    : `<span style="color:var(--err)">missing</span>`;

  /**
   * Ask /api/health which variables actually landed. Guessing from a
   * failing order book is the slow way to find a typo in one name.
   */
  async function healthHTML() {
    let h;
    try {
      const res = await api("/api/health");
      if (!res.ok) return "";
      h = await res.json();
    } catch { return ""; }

    const rt = h.db.roundTrip;
    return `
      <p class="eyebrow u-mt-md">What the server can see</p>
      <ul class="order-items">
        <li><code>DATABASE_URL</code> — ${tick(h.db.DATABASE_URL)} <span class="sub">(Neon)</span></li>
        <li><code>RAZORPAY_KEY_ID</code> — ${tick(h.payment.RAZORPAY_KEY_ID)}</li>
        <li><code>RAZORPAY_KEY_SECRET</code> — ${tick(h.payment.RAZORPAY_KEY_SECRET)}</li>
        <li><code>RAZORPAY_WEBHOOK_SECRET</code> — ${tick(h.payment.RAZORPAY_WEBHOOK_SECRET)} <span class="sub">(must match the Razorpay Dashboard webhook)</span></li>
        <li><code>ADMIN_TOKEN</code> — ${tick(h.admin.configured)}${h.admin.configured && !h.admin.tokenAccepted ? ` <span style="color:var(--err)">(the token you entered does not match)</span>` : ""}</li>
        <li><code>RESEND_API_KEY</code> — ${tick(h.mail.RESEND_API_KEY)}</li>
        <li><code>SELLER_EMAIL</code> — ${tick(h.mail.SELLER_EMAIL)}</li>
        <li><code>MAIL_FROM</code> — ${tick(h.mail.MAIL_FROM)} <span class="sub">(optional)</span></li>
      </ul>
      ${rt ? `<p class="panel-note">Live database check: ${rt.ok
        ? `<span style="color:var(--ok)">reachable in ${rt.ms} ms</span>`
        : `<span style="color:var(--err)">failed — ${esc(rt.error ?? "no response")}</span>`}</p>` : ""}
      <p class="panel-note">
        Orders record as soon as <code>DATABASE_URL</code> is set. Payment
        needs the two Razorpay keys; automatic delivery needs the webhook
        secret too. Email only affects whether anyone is notified.
      </p>`;
  }

  async function setupHTML(detail) {
    return `
    <div class="glass u-pad">
      <p class="eyebrow">Backend not configured</p>
      <h3>Checkout is not available to buyers</h3>
      <p class="panel-note">${esc(detail)}</p>
      <p class="panel-note">
        There is no manual fallback any more — until these are set in Vercel
        under <strong>Settings → Environment Variables</strong> (then
        redeploy), the cart page shows buyers a "checkout unavailable"
        message instead of a broken payment flow.
      </p>
      ${await healthHTML()}
    </div>`;
  }

  function actionsHTML(o) {
    if (o.status === "paid" || o.status === "delivered") {
      return `
        <div class="order-line-actions">
          <button class="btn btn-sm btn-ghost" data-action="delivered" data-ref="${esc(o.ref)}">Resend</button>
          <button class="btn btn-sm btn-vital" data-action="refunded" data-ref="${esc(o.ref)}">Refund</button>
        </div>`;
    }
    if (o.status === "created") {
      return `
        <div class="order-line-actions">
          <button class="btn btn-sm btn-ghost" data-action="cancelled" data-ref="${esc(o.ref)}">Cancel</button>
        </div>`;
    }
    return `<span class="note-tag" style="margin:0">${esc(STATUS_LABEL[o.status] ?? o.status)}</span>`;
  }

  function orderHTML(o) {
    return `
    <div class="cart-line order-line">
      <div class="cart-line-body">
        <h4>${esc(o.ref)} · ${money(o.total)}</h4>
        <span class="sub">
          ${new Date(o.placed_at).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" })}
          · ${esc(STATUS_LABEL[o.status] ?? o.status)}
        </span>
        <ul class="order-items">
          ${o.items.map((i) => `<li>${esc(i.title)} — ${money(i.price)}</li>`).join("")}
        </ul>
        <p class="panel-note u-mt-sm" style="margin-bottom:0">
          <a href="mailto:${encodeURIComponent(o.email)}">${esc(o.email)}</a>
          ${o.razorpay_payment_id ? `· Razorpay <strong>${esc(o.razorpay_payment_id)}</strong>` : ""}
        </p>
      </div>
      ${actionsHTML(o)}
    </div>`;
  }

  /**
   * A separate, always-visible strip showing whether automatic file
   * delivery is wired up — independent of whether the database/Razorpay
   * are, since a seller might have orders and payment working fine and
   * still be wondering why nobody's getting a download link.
   */
  async function loadFileDeliveryStatus() {
    const el = document.getElementById("file-delivery-status");
    if (!el) return;
    let h;
    try {
      h = await (await api("/api/health")).json();
    } catch { return; }

    const fd = h.fileDelivery;
    if (!fd.configured) {
      el.innerHTML = `
        <div class="glass u-pad-sm u-mt-md">
          <p class="eyebrow">File delivery not set up</p>
          <p class="panel-note">
            Payment and orders can still work, but nobody gets a download
            link yet. Connect a PRIVATE Vercel Blob store
            (<strong>Storage → Create Database → Blob</strong> in your
            Vercel dashboard — this sets <code>BLOB_READ_WRITE_TOKEN</code>
            for you), then run <code>tools/upload-note.mjs</code> for each
            PDF and paste the pathname it prints into that title's
            <code>blobPath</code> in <code>js/catalog.js</code>. The site
            signs a fresh, expiring download link from that pathname
            automatically the instant a payment is confirmed.
          </p>
        </div>`;
    } else if (fd.titlesLinked === 0) {
      el.innerHTML = `
        <div class="glass u-pad-sm u-mt-md">
          <p class="eyebrow">File delivery ready, nothing uploaded yet</p>
          <p class="panel-note">
            Storage is connected but no title has a <code>blobPath</code> —
            run <code>tools/upload-note.mjs</code> for a PDF and paste the
            pathname it prints into <code>js/catalog.js</code>.
          </p>
        </div>`;
    } else {
      el.innerHTML = `
        <div class="glass u-pad-sm u-mt-md">
          <p class="panel-note">
            File delivery: <strong>${fd.titlesLinked}</strong> of
            ${fd.titlesTotal} titles auto-attach on delivery.
          </p>
        </div>`;
    }
  }

  async function load() {
    if (!token()) { root.innerHTML = signInHTML(); return wireSignIn(); }

    root.innerHTML = `<p class="empty-state">Loading orders…</p>`;

    let res;
    try {
      res = await api("/api/orders");
    } catch {
      root.innerHTML = await setupHTML("Could not reach /api/orders. If you are running the site from a plain static server, the API only exists on Vercel.");
      return;
    }

    if (res.status === 401) {
      setToken("");
      root.innerHTML = signInHTML("That token was not accepted.");
      return wireSignIn();
    }
    if (res.status === 404) {
      root.innerHTML = await setupHTML("There is no /api/orders route on this host — the site is being served as plain static files.");
      return;
    }
    if (res.status === 501) {
      root.innerHTML = await setupHTML((await res.json()).error);
      return;
    }
    if (!res.ok) {
      root.innerHTML = await setupHTML(`The server returned ${res.status}.`);
      return;
    }

    const { orders, count, unpaid, revenue } = await res.json();

    root.innerHTML = `
      <div class="stat-grid">
        <div class="stat"><div class="stat-label">Unpaid checkouts</div><div class="stat-value">${unpaid}</div></div>
        <div class="stat"><div class="stat-label">Orders</div><div class="stat-value">${count}</div></div>
        <div class="stat"><div class="stat-label">Delivered value</div><div class="stat-value">${money(revenue)}</div></div>
      </div>
      <div id="file-delivery-status"></div>
      ${orders.length
        ? orders.map(orderHTML).join("")
        : `<div class="glass empty-state">${icons.book}<h3>No orders yet</h3>
             <p>They will appear here the moment someone checks out.</p></div>`}
      <button class="btn btn-ghost btn-sm u-mt-md" id="signout">Forget this token</button>`;

    loadFileDeliveryStatus();

    document.getElementById("signout").addEventListener("click", () => {
      setToken(""); load();
    });
  }

  function wireSignIn() {
    document.getElementById("signin").addEventListener("submit", (e) => {
      e.preventDefault();
      setToken(document.getElementById("token").value.trim());
      load();
    });
  }

  const ACTION_LABEL = { delivered: "Resending…", refunded: "Refunding…", cancelled: "Cancelling…" };
  const DONE_LABEL = { delivered: "Resent — buyer emailed", refunded: "Marked refunded", cancelled: "Marked cancelled" };

  root.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const status = btn.dataset.action;
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = ACTION_LABEL[status] ?? "Working…";
    try {
      const res = await api("/api/order-status", {
        method: "POST",
        body: JSON.stringify({ ref: btn.dataset.ref, status }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error ?? res.status);
      toast(DONE_LABEL[status] ?? "Updated");
      load();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = original;
      toast(String(err.message ?? err));
    }
  });

  load();
</script>

</body>
</html>
