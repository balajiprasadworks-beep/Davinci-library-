<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order book — DaVinci's Medical Library</title>
<meta name="description" content="Seller order book.">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c9a55c' stroke-width='2'/><path d='m20 11-3 7-7 3 3-7z' fill='%23e3c88a'/></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main class="wrap section" id="main">
  <div class="section-head">
    <p class="eyebrow">Seller only</p>
    <h1>Order book</h1>
    <p class="lede">
      Every order recorded on the server, newest first. Check the payment
      landed in your account, send the files, then mark it delivered.
    </p>
  </div>

  <div id="root"></div>
</main>

<div id="footer-slot"></div>

<script type="module">
  import { money } from "./js/config.js";
  import { mountShell, toast, icons } from "./js/shell.js";

  mountShell("");

  const root = document.getElementById("root");
  const KEY = "davinci.admin.token";
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const token = () => { try { return localStorage.getItem(KEY) ?? ""; } catch { return ""; } };
  const setToken = (t) => { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch {} };

  const api = (path, options = {}) =>
    fetch(path, {
      ...options,
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token()}`, ...options.headers },
    });

  const STATUS_LABEL = {
    "awaiting-payment-check": "Awaiting payment check",
    delivered: "Delivered",
    refunded: "Refunded",
    cancelled: "Cancelled",
  };

  function signInHTML(message = "") {
    return `
    <div class="glass u-pad u-narrow">
      <p class="eyebrow">Admin token</p>
      <p class="panel-note">
        The value of <code>ADMIN_TOKEN</code> from your Vercel environment
        variables. It is kept in this browser only.
      </p>
      ${message ? `<p class="panel-note" style="color:var(--err)">${esc(message)}</p>` : ""}
      <form id="signin">
        <div class="field">
          <label for="token">Token</label>
          <input type="password" id="token" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Open the order book</button>
      </form>
    </div>`;
  }

  function setupHTML(detail) {
    return `
    <div class="glass u-pad">
      <p class="eyebrow">Backend not configured</p>
      <h3>Orders are not being recorded</h3>
      <p class="panel-note">${esc(detail)}</p>
      <p class="panel-note">
        Checkout still works — it falls back to the buyer emailing you the
        reference. To record orders server-side, set these in Vercel under
        <strong>Settings → Environment Variables</strong>, then redeploy:
      </p>
      <ul class="order-items">
        <li><code>UPSTASH_REDIS_REST_URL</code> and <code>UPSTASH_REDIS_REST_TOKEN</code> — free Upstash Redis database</li>
        <li><code>ADMIN_TOKEN</code> — any long random string; it opens this page</li>
        <li><code>RESEND_API_KEY</code> and <code>SELLER_EMAIL</code> — so a new order emails you</li>
      </ul>
    </div>`;
  }

  function orderHTML(o) {
    const outstanding = o.status === "awaiting-payment-check";
    return `
    <div class="cart-line order-line">
      <div class="cart-line-body">
        <h4>${esc(o.ref)} · ${money(o.total)}</h4>
        <span class="sub">
          ${new Date(o.placedAt).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" })}
          · ${esc(STATUS_LABEL[o.status] ?? o.status)}
        </span>
        <ul class="order-items">
          ${o.items.map((i) => `<li>${esc(i.title)} — ${money(i.price)}</li>`).join("")}
        </ul>
        <p class="panel-note u-mt-sm" style="margin-bottom:0">
          <a href="mailto:${encodeURIComponent(o.email)}">${esc(o.email)}</a>
          · UPI ref <strong>${esc(o.txnId)}</strong>
        </p>
      </div>
      ${outstanding
        ? `<button class="btn btn-sm btn-vital" data-deliver="${esc(o.ref)}">Mark delivered</button>`
        : `<span class="note-tag" style="margin:0">${esc(STATUS_LABEL[o.status] ?? o.status)}</span>`}
    </div>`;
  }

  async function load() {
    if (!token()) { root.innerHTML = signInHTML(); return wireSignIn(); }

    root.innerHTML = `<p class="empty-state">Loading orders…</p>`;

    let res;
    try {
      res = await api("/api/orders");
    } catch {
      root.innerHTML = setupHTML("Could not reach /api/orders. If you are running the site from a plain static server, the API only exists on Vercel.");
      return;
    }

    if (res.status === 401) {
      setToken("");
      root.innerHTML = signInHTML("That token was not accepted.");
      return wireSignIn();
    }
    if (res.status === 404) {
      root.innerHTML = setupHTML("There is no /api/orders route on this host — the site is being served as plain static files.");
      return;
    }
    if (res.status === 501) {
      root.innerHTML = setupHTML((await res.json()).error);
      return;
    }
    if (!res.ok) {
      root.innerHTML = setupHTML(`The server returned ${res.status}.`);
      return;
    }

    const { orders, count, outstanding, revenue } = await res.json();

    root.innerHTML = `
      <div class="stat-grid">
        <div class="stat"><div class="stat-label">Awaiting you</div><div class="stat-value">${outstanding}</div></div>
        <div class="stat"><div class="stat-label">Orders</div><div class="stat-value">${count}</div></div>
        <div class="stat"><div class="stat-label">Delivered value</div><div class="stat-value">${money(revenue)}</div></div>
      </div>
      ${orders.length
        ? orders.map(orderHTML).join("")
        : `<div class="glass empty-state">${icons.book}<h3>No orders yet</h3>
             <p>They will appear here the moment someone checks out.</p></div>`}
      <button class="btn btn-ghost btn-sm u-mt-md" id="signout">Forget this token</button>`;

    document.getElementById("signout").addEventListener("click", () => {
      setToken(""); load();
    });
  }

  function wireSignIn() {
    document.getElementById("signin").addEventListener("submit", (e) => {
      e.preventDefault();
      setToken(document.getElementById("token").value.trim());
      load();
    });
  }

  root.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-deliver]");
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = "Marking…";
    try {
      const res = await api("/api/order-status", {
        method: "POST",
        body: JSON.stringify({ ref: btn.dataset.deliver, status: "delivered" }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error ?? res.status);
      toast(data.notified ? "Marked delivered — buyer emailed" : "Marked delivered");
      load();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Mark delivered";
      toast(String(err.message ?? err));
    }
  });

  load();
</script>

</body>
</html>
